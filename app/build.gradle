plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
//    id 'com.onesignal.androidsdk.onesignal-gradle-plugin'
//    id 'com.google.firebase.firebase-perf'
}

android {
    namespace 'com.camera.gps'
    compileSdk 36

    defaultConfig {
        applicationId "com.camera.gps"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "1.0.0"
        multiDexEnabled true
//        manifestPlaceholders = [
//                onesignal_app_id: '3c3fd41c-15e7-4d68-8201-e8a7174d9c6a',
//                onesignal_google_project_number: 'REMOTE'
//        ]
        resConfigs "en", "in", "es", "vi", "th", "pt", "ru", "fr", "ko", "hi"
    }
    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        android.applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = "GPS Map Camera - ${defaultConfig.versionName}.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.10.1'
//    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // sdp & ssp
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    //kotlin
    modules {
        module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") {
            replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") {
            replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }

    //lottieAnimation
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'


        // Room (for database)
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'
    //dotsindicator
    implementation 'me.relex:circleindicator:2.1.6'

    // gps map
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.maps.android:android-maps-utils:3.5.3'


    // CameraX
    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"

    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    implementation 'com.google.code.gson:gson:2.11.0'

    // Video export used to burn GPS stamps into shared videos.
    def media3_version = "1.8.0"
    implementation "androidx.media3:media3-transformer:${media3_version}"
    implementation "androidx.media3:media3-effect:${media3_version}"

    // FastSave
    implementation 'com.github.yehiahd:FastSave-Android:1.0.6'

    // Color Picker
    implementation 'com.github.Mohammad3125:KavehColorPicker:v1.2.1'


    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.11.0'

    // Shrimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //Firebase
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'
    implementation 'com.google.firebase:firebase-crashlytics'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    // Unity
    implementation 'com.unity3d.ads:unity-ads:4.9.2'

    // Required Google Play Services (if not already included)
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.2.0'

    // Required for Android 12+ (if your target SDK is 31+)
    implementation 'com.google.android.gms:play-services-appset:16.0.2'

}

